# Plantilla de compose de un servicio de Freya.
# Se lanza desde la raíz del monorepo:
#   docker compose -f cicd/docker-compose.yml up -d

services:
  cicd:
    build:
      context: ..
      dockerfile: cicd/Dockerfile
      # Sin esto, Docker construye la última etapa del Dockerfile (`dev`,
      # cuyo CMD es pytest) en vez de `runtime`.
      target: runtime
    image: freya/cicd:dev
    container_name: freya-cicd
    restart: unless-stopped

    environment:
      FREYA_SERVICE_NAME: cicd
      FREYA_PORT: "8007"
      FREYA_LOG_LEVEL: "${FREYA_LOG_LEVEL:-info}"
      FREYA_ENVIRONMENT: "${FREYA_ENVIRONMENT:-dev}"
      FREYA_AUTH_ENABLED: "${FREYA_AUTH_ENABLED:-true}"
      FREYA_AUTH_URL: "https://freya-auth:8002"
      FREYA_GESTOR_DB_URL: "https://freya-gestor-db:8001"
      FREYA_SECRETS_URL: "https://freya-secrets:8003"
      FREYA_STORAGE_URL: "https://freya-storage:8004"
      FREYA_API_KEY: "cicd"

    volumes:
      - ../infra/certs/cicd:/run/certs:ro
      - ../infra/secrets/cicd:/run/secrets:ro
      # Contexto de build para `docker build` (COPY libs/, COPY
      # services/<nombre>/...): sólo lectura, cicd nunca escribe en el repo.
      - ..:/workspace:ro
      # Escritura, a diferencia de gestor-monitoring: hace falta crear y
      # correr contenedores (la imagen de test de cada servicio), no sólo
      # listar. Decidido en vivo con el usuario -- ver README, alcance
      # deliberadamente estrecho (sólo el camino fijo de runner.py).
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - freya-mesh

    # El socket es 660 root:root (comprobado en gestor-monitoring): el
    # proceso sigue como UID 10001, nunca root, con el grupo 0 como
    # suplementario para que el permiso de grupo del socket le alcance.
    group_add:
      - "0"

    # Sin puertos publicados: sólo frontend habla con el exterior.

    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

    labels:
      freya.service: "cicd"
      freya.metrics.port: "8007"
      freya.metrics.path: "/metrics"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  freya-mesh:
    external: true
