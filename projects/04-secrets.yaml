id: secrets
name: Secrets (Barbican)
phase: 3
difficulty: 5
depends_on: [gestor-db, auth]
description: >
  Custodia de secretos, tokens, credenciales, API keys y certificados de todos
  los proyectos. Freya guarda aquí los suyos; otros tenants los suyos.

tasks:
  - id: sec-01
    title: Esqueleto del servicio y schema freya_secrets
    difficulty: 2
    acceptance: Tablas de secretos, versiones, claves de datos y auditoría creadas.

  - id: sec-02
    title: Envelope encryption con AES-256-GCM
    difficulty: 5
    depends_on: [sec-01]
    acceptance: Master key montada en fichero, clave de datos por tenant cifrada en base; la base robada no revela nada sin la master key.

  - id: sec-03
    title: CRUD de secretos con versionado
    difficulty: 3
    depends_on: [sec-02]
    acceptance: Escribir crea versión nueva sin destruir la anterior; se puede leer una versión concreta o la vigente.

  - id: sec-04
    title: Rotación de secretos y master key
    difficulty: 5
    depends_on: [sec-03]
    acceptance: Rotar la master key recifra todas las claves de datos sin downtime ni pérdida.

  - id: sec-05
    title: CA interna y emisión de certificados
    difficulty: 4
    depends_on: [sec-02]
    acceptance: Emite, renueva y revoca certificados de servicio; sustituye a la CA de desarrollo de la Fase 0.

  - id: sec-06
    title: Auditoría de accesos
    difficulty: 2
    depends_on: [sec-03]
    acceptance: Cada lectura queda registrada con actor, secreto, versión y momento; el valor jamás aparece en logs.

  - id: sec-07
    title: RETORNO - migrar credenciales de gestor-db y auth
    difficulty: 3
    depends_on: [sec-03]
    acceptance: Ninguno de los dos servicios tiene un secreto real en su entorno; los piden a secrets al arrancar.
