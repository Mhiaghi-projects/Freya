# Plantilla de workflow de GitHub Actions para un servicio de Freya, en el
# monorepo único (docs/DECISIONS.md, "go with mono"). Copiar a
# .github/workflows/deploy-auth.yml en la RAIZ del repo (los
# workflows sólo se descubren ahí -- GitHub Actions nunca mira
# <servicio>/.github/workflows/, ese fue el bug real que hizo que "no
# saliera nada en GitHub Actions" la primera vez) y sustituir
# auth (mismo mecanismo de plantilla que
# templates/service-python/, ver infra/scripts/new_service.sh).
#
# paths: sólo dispara cuando cambia ESTE servicio -- mismo aislamiento por
# servicio que daba un repo aparte con su propio pipeline, sin necesitar
# 8 repos de verdad (que reintroducirían el problema de que
# freya-common no estaría al lado en un checkout aislado de un solo
# servicio).
#
# No usa actions/checkout: el runner autoalojado (services/github-runner/)
# tiene el propio monorepo montado en /workspace, en el mismo sitio que
# usa freya.ps1 -- infra/certs e infra/secrets sólo existen ahí, en el
# host, nunca en un checkout de CI aislado.
#
# Reproduce a mano los mismos pasos que .freya/pipeline.yaml declaraba
# para el viejo cicd (docs/ROADMAP.md ci-02): lint, test, security_scan.

name: Deploy auth

on:
  push:
    branches: [main]
    paths: ["auth/**"]

jobs:
  deploy:
    runs-on: [self-hosted, freya]
    defaults:
      run:
        working-directory: /workspace

    steps:
      - name: Actualizar el checkout local
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Construir imagen de test
        run: |
          docker build --quiet --target dev \
            --tag freya/auth:test \
            --file auth/Dockerfile .

      - name: Lint
        run: docker run --rm --network none freya/auth:test ruff check /srv/app

      - name: Test
        run: docker run --rm --network none freya/auth:test pytest -v /srv/tests

      - name: Security scan
        run: docker run --rm --env HOME=/tmp freya/auth:test pip-audit

      - name: Desplegar
        run: |
          docker compose --project-name freya \
            -f auth/docker-compose.yml --env-file .env \
            up -d --build
