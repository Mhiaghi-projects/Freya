# Plantilla de workflow de GitHub Actions para un servicio de Freya, en el
# monorepo único (docs/DECISIONS.md, "go with mono"). Copiar a
# .github/workflows/deploy-storage.yml en la RAIZ del repo (los
# workflows sólo se descubren ahí -- GitHub Actions nunca mira
# <servicio>/.github/workflows/, ese fue el bug real que hizo que "no
# saliera nada en GitHub Actions" la primera vez) y sustituir
# storage (mismo mecanismo de plantilla que
# templates/service-python/, ver infra/scripts/new_service.sh).
#
# paths: sólo dispara cuando cambia ESTE servicio -- mismo aislamiento por
# servicio que daba un repo aparte con su propio pipeline, sin necesitar
# 8 repos de verdad (que reintroducirían el problema de que
# freya-common no estaría al lado en un checkout aislado de un solo
# servicio).
#
# Dos jobs, no uno (docs/RUNBOOK.md tiene el detalle operativo completo):
#
#   1. "check" -- corre en un runner de GitHub (ubuntu-latest, efímero, de
#      pago por GitHub, nunca toca el PC del usuario). checkout de verdad
#      (actions/checkout), build de la imagen "dev", lint, test, security
#      scan (pip-audit) y escaneo de la imagen "runtime" con Trivy.
#      Reproduce a mano los mismos pasos que .freya/pipeline.yaml
#      declaraba para el viejo cicd (docs/ROADMAP.md ci-02).
#
#      pip-audit y Trivy no son lo mismo: pip-audit mira las dependencias
#      Python que este servicio instala; Trivy mira TODA la imagen
#      "runtime" que de verdad se despliega, incluido el sistema operativo
#      base (python:3.12-slim trae sus propios paquetes apt, con sus
#      propios CVEs, que pip-audit nunca ve). Sólo falla en CRITICAL con
#      parche disponible (`ignore-unfixed: true`) -- bloquear en HIGH o en
#      CVEs sin parche disponible convertiría el pipeline en un muro que
#      nadie puede destrabar.
#
#   2. "deploy" -- needs: check, así que si el paso 1 falla esto ni
#      arranca: código que no pasa lint/test/security_scan nunca llega a
#      ejecutarse en el PC del usuario. Corre en el runner autoalojado
#      (services/github-runner/), que tiene el propio monorepo montado en
#      /workspace, en el mismo sitio que usa freya.ps1 -- infra/certs e
#      infra/secrets sólo existen ahí, en el host, nunca en el checkout
#      efímero del job "check". Usa services/github-runner/deploy-service.sh,
#      no "docker compose up" directo -- Docker-outside-of-Docker gotcha
#      real encontrado en vivo: las rutas relativas de "volumes:" del
#      docker-compose.yml del servicio (../infra/certs/...,
#      ../infra/secrets/...) las resuelve el DAEMON del host, no este
#      contenedor, así que /workspace/... no significa nada para él y
#      monta un directorio vacío en vez de los certificados reales. Ver
#      ese script para el porqué exacto.

name: Deploy storage

on:
  push:
    branches: [main]
    paths: ["storage/**"]
  # Para re-desplegar el mismo commit sin un cambio de código (ver
  # docs/RUNBOOK.md, "Desplegar sin un cambio de código") -- botón "Run
  # workflow" en la pestaña Actions de GitHub.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen de test
        run: |
          docker build --quiet --target dev \
            --tag freya/storage:test \
            --file storage/Dockerfile .

      - name: Lint
        run: docker run --rm --network none freya/storage:test ruff check /srv/app

      - name: Test
        run: docker run --rm --network none freya/storage:test pytest -v /srv/tests

      - name: Security scan (dependencias Python)
        run: docker run --rm --env HOME=/tmp freya/storage:test pip-audit

      - name: Construir imagen runtime
        run: |
          docker build --quiet --target runtime \
            --tag freya/storage:runtime-scan \
            --file storage/Dockerfile .

      - name: Security scan (imagen runtime completa, incluido el SO base)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: freya/storage:runtime-scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: check
    runs-on: [self-hosted, freya]
    defaults:
      run:
        working-directory: /workspace

    steps:
      - name: Actualizar el checkout local
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Desplegar
        run: bash services/github-runner/deploy-service.sh storage
