# Plantilla de compose de un servicio de Freya.
# Se lanza desde la raíz del monorepo:
#   docker compose -f storage/docker-compose.yml up -d

services:
  storage:
    build:
      context: ..
      dockerfile: storage/Dockerfile
      # Sin esto, Docker construye la última etapa del Dockerfile (`dev`,
      # cuyo CMD es pytest) en vez de `runtime`.
      target: runtime
    image: freya/storage:dev
    container_name: freya-storage
    restart: unless-stopped

    environment:
      FREYA_SERVICE_NAME: storage
      FREYA_PORT: "8004"
      FREYA_LOG_LEVEL: "${FREYA_LOG_LEVEL:-info}"
      FREYA_ENVIRONMENT: "${FREYA_ENVIRONMENT:-dev}"
      FREYA_AUTH_ENABLED: "${FREYA_AUTH_ENABLED:-true}"
      FREYA_AUTH_URL: "https://freya-auth:8002"
      FREYA_GESTOR_DB_URL: "https://freya-gestor-db:8001"
      FREYA_SECRETS_URL: "https://freya-secrets:8003"
      FREYA_STORAGE_URL: "https://freya-storage:8004"
      FREYA_API_KEY: "storage"

    volumes:
      - ../infra/certs/storage:/run/certs:ro
      - ../infra/secrets/storage:/run/secrets:ro
      # D:\share, no un volumen con nombre: storage es el NAS de Freya --
      # todo lo que no sea código ni una fila de database vive aquí, visible
      # y navegable directamente en el host (una carpeta real por
      # tenant/bucket/key, ver app/domain/blob_store.py).
      - D:/share:/data

    networks:
      - freya-mesh

    # Sin puertos publicados: sólo frontend habla con el exterior.

    tmpfs:
      - /tmp:size=32m,mode=1777
    read_only: true

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          # CIS Docker Benchmark 5.28: sin esto, nada frena un fork-bomb
          # dentro del contenedor -- --workers 1 no necesita más de un
          # puñado de PIDs en operación normal. Va aquí, no en el
          # "pids_limit" de nivel de servicio -- con "deploy:" ya presente,
          # Compose trata ambos como el mismo ajuste y no deja fijarlos por
          # separado.
          pids: 128

    labels:
      freya.service: "storage"
      freya.metrics.port: "8004"
      freya.metrics.path: "/metrics"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  freya-mesh:
    external: true
